<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Endless Worlds</title>
		<!-- The game's own loading page (export preset: html/custom_html_shell). Based on Godot's
		     full-size shell: same engine start-up code, but the splash picture (tools/make_splash.py)
		     with a pixel loading bar and tips instead of the Godot logo and a browser progress bar. -->
		<style>
@font-face {
	font-family: 'Jersey';
	src: url('Jersey10-Regular.ttf') format('truetype');
	font-display: swap;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #0c1030;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* sky colour above the picture, sea colour below it: no black bars on tall or wide screens */
#status {
	position: absolute;
	inset: 0;
	background: linear-gradient(#100e2e 0%, #100e2e 50%, #0c1030 50%, #0c1030 100%);
	visibility: hidden;
	opacity: 1;
	transition: opacity 0.45s ease;
	font-family: 'Jersey', 'Courier New', monospace;
	user-select: none;
}

#status.done {
	opacity: 0;
}

#status-splash {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	object-fit: contain;
	image-rendering: pixelated;
}

#loader {
	position: absolute;
	left: 50%;
	bottom: 14px;
	transform: translateX(-50%);
	width: min(560px, 82vw);
	text-align: center;
}

#bar {
	position: relative;
	height: 22px;
	background: #0b0d22;
	border: 4px solid #ffcc48;
	box-shadow: 0 0 0 4px #22102c, 0 6px 0 4px rgba(0, 0, 0, 0.35);
	overflow: hidden;
}

#fill {
	height: 100%;
	width: 0%;
	background:
		repeating-linear-gradient(90deg, transparent 0 18px, rgba(11, 13, 34, 0.55) 18px 22px),
		linear-gradient(#fff0a0 0 30%, #ffcc48 30% 75%, #e08a2c 75% 100%);
	transition: width 0.2s linear;
}

/* nothing to measure (engine starting up): a lit block slides along the bar */
#bar.busy #fill {
	width: 28% !important;
	animation: slide 1.1s steps(14) infinite;
}

@keyframes slide {
	from { margin-left: -28%; }
	to { margin-left: 100%; }
}

#label {
	margin-top: 12px;
	font-size: 26px;
	letter-spacing: 1px;
	color: #ffcc48;
	text-shadow: 3px 3px 0 #22102c, -2px 0 0 #22102c, 2px 0 0 #22102c, 0 -2px 0 #22102c;
}

#tip {
	margin-top: 4px;
	min-height: 24px;
	font-size: 22px;
	color: #faecd6;
	text-shadow: 2px 2px 0 #22102c, -2px 0 0 #22102c, 2px 0 0 #22102c, 0 -2px 0 #22102c;
	transition: opacity 0.3s ease;
}

#status-notice {
	display: none;
	position: absolute;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	max-width: 80vw;
	background-color: #22102c;
	border: 4px solid #e0503c;
	color: #faecd6;
	font-size: 24px;
	line-height: 1.3;
	padding: 1rem 1.4rem;
	text-align: center;
	z-index: 1;
}

@media (max-height: 420px) {
	#loader { bottom: 8px; }
	#label { font-size: 24px; margin-top: 8px; }
	#tip { font-size: 20px; }
	#bar { height: 18px; }
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="$GODOT_SPLASH" alt="Endless Worlds">
			<div id="loader">
				<div id="bar"><div id="fill"></div></div>
				<div id="label">Loading 0%</div>
				<div id="tip"></div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const loader = document.getElementById('loader');
	const bar = document.getElementById('bar');
	const fill = document.getElementById('fill');
	const label = document.getElementById('label');
	const tip = document.getElementById('tip');

	const tips = [
		'Find the well and answer its riddle to move on.',
		'Lit lamps hold hints. Walk up and read them.',
		'Stuck? Ask Bolt, your robot guide.',
		'Survival mode hides behind the bug button on the Stats page.',
		'In Survival, every level-up is a new perk.',
		'Chain kills for a combo: more score, bonus coins.',
		'Night pays better, and bites harder.',
		'Play with friends: share a room code or an invite link.',
	];
	let tipIndex = Math.floor(Math.random() * tips.length);
	tip.textContent = tips[tipIndex];
	const tipTimer = setInterval(() => {
		tip.style.opacity = '0';
		setTimeout(() => {
			tipIndex = (tipIndex + 1) % tips.length;
			tip.textContent = tips[tipIndex];
			tip.style.opacity = '1';
		}, 300);
	}, 3500);

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			clearInterval(tipTimer);
			statusOverlay.classList.add('done');   // fade out, then get out of the way
			setTimeout(() => statusOverlay.remove(), 500);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		loader.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'This browser cannot run the game. Missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0 && current < total) {
					const pct = Math.floor(current / total * 100);
					bar.classList.remove('busy');
					fill.style.width = pct + '%';
					label.textContent = 'Loading ' + pct + '%';
				} else {
					// size unknown, or everything is downloaded and the engine is starting
					bar.classList.add('busy');
					label.textContent = current > 0 && total > 0 ? 'Waking the island...' : 'Loading...';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
